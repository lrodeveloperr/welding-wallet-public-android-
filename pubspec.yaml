name: welding_wallet
description: Offline welding gas, consumable batch, certificate and history records for Android and iOS.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  path_provider: ^2.1.5
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0
  url_launcher: ^6.3.2
  in_app_purchase: ^3.3.0
  uuid: ^4.5.1
  file_picker: ^12.1.3
  mobile_scanner: ^7.4.0
  open_filex: ^4.7.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 800
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 900
