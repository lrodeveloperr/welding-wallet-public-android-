name: One-time cylinder-only migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cylinder-only-migration.yml'
      - '.github/scripts/cylinder_only_v2.py.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply bounded cylinder-only migration
        shell: bash
        run: |
          set -euo pipefail
          BASE=408b6e03257c922521c55d3259f2f506baebd881

          # Restore only the domain files from the last known cylinder-only
          # baseline. UI/controller stay on the current branch and are edited
          # surgically by the migration script to avoid visual regression.
          git checkout "$BASE" -- lib/core/models.dart lib/core/wallet_engine.dart

          git rm -f --ignore-unmatch \
            lib/core/consumables.dart \
            lib/services/document_store.dart \
            docs/welding-wallet-name-checklist.md

          base64 -d .github/scripts/cylinder_only_v2.py.gz.b64 | gzip -d > /tmp/cylinder_only_v2.py
          python3 /tmp/cylinder_only_v2.py

          # No active consumable/certificate module may remain. Scanner terms
          # are intentionally allowed because scanning cylinder serials remains.
          if grep -RniE 'consumable|certificate|qr_flutter|open_filex|document_store' lib pubspec.yaml; then
            echo 'Cylinder-only product-boundary violation found.' >&2
            exit 1
          fi

          git status --short

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Render current dashboard evidence
        run: flutter test --update-goldens test/dashboard_golden_test.dart

      - name: Test cylinder-only domain and widgets
        run: flutter test

      - name: Build debug APK
        shell: bash
        run: flutter build apk --debug

      - name: Final boundary gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'consumable|certificate|qr_flutter|open_filex|document_store' lib pubspec.yaml; then
            echo 'Cylinder-only product-boundary violation found after build.' >&2
            exit 1
          fi
          test ! -e lib/core/consumables.dart
          test ! -e lib/services/document_store.dart

      - name: Commit verified cylinder-only source
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/cylinder-only-migration.yml .github/scripts/cylinder_only_v2.py.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove consumable and certificate tracking; cylinders only [skip ci]"
          git push
