name: Flutter iOS Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Verify no advertising SDK
        shell: bash
        run: |
          if rg -n -i 'google_mobile_ads|admob|GADApplicationIdentifier|com\.google\.android\.gms\.ads' pubspec.yaml pubspec.lock lib android ios; then
            echo 'Advertising code or configuration must not ship in Welding Gas Wallet.'
            exit 1
          fi
      - run: flutter analyze --fatal-infos
      - run: flutter test --exclude-tags golden
      - run: flutter build ios --debug --no-codesign
