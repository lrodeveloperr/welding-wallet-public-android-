name: Flutter Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify no advertising SDK
        shell: bash
        run: |
          if rg -n -i 'google_mobile_ads|admob|GADApplicationIdentifier|com\.google\.android\.gms\.ads' pubspec.yaml pubspec.lock lib android ios; then
            echo 'Advertising code or configuration must not ship in Welding Gas Wallet.'
            exit 1
          fi

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test Flutter domain and widgets
        run: flutter test --exclude-tags golden

      - name: Build debug APK
        id: flutter_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welding-wallet-flutter-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload debug APK
        if: steps.flutter_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: welding-wallet-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Fail if Flutter build failed
        if: steps.flutter_build.outcome == 'failure'
        run: exit 1
