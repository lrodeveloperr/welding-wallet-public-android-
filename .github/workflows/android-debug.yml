          cat > README.md <<'MD'
          # Welding Gas Wallet

          Welding Gas Wallet is an offline-first Flutter app for recording welding-gas cylinders, suppliers, ownership, refill/exchange costs, due-date reminders and optional native-file backup on Android and iOS.

          ## Product boundary

          The product is cylinders only. It does not track welding consumables, batches/lots, material or manufacturer certificates, WPS/PQR, welder qualifications, weld maps, production planning or welding-compliance decisions.

          ## Monetization

          - Free: one fixed non-personalized bottom banner and up to three current editable cylinders.
          - Pro: no ads and unlimited cylinder records.
          - Android uses the configured monthly/annual subscriptions.
          - iOS uses the configured one-time lifetime unlock.
          - Store identifiers keep the legacy `weldinggaswallet` token for upgrade and entitlement continuity.

          ## Data and backup

          Core records stay local and work offline. Backup is optional through the native file picker (including Google Drive/iCloud Drive where exposed by the platform). Backups never carry entitlement state.

          The data schema remains at v5 solely for forward compatibility with installs that briefly wrote the removed consumable/certificate fields. Those obsolete fields are ignored by the cylinder-only model and are not written into new wallet data or exports.

          ## Build

          Requirements: Flutter 3.47.2, Dart 3.13 or newer, Android SDK 26+, and Xcode 15+ for iOS.

          ```bash
          flutter pub get
          flutter gen-l10n
          flutter analyze --fatal-infos
          flutter test
          flutter build apk --debug
          ```

          ## Privacy and support

          - Privacy: https://lrodeveloperr.github.io/privacy-policy/welding-gas-wallet/privacy/
          - Terms: https://lrodeveloperr.github.io/privacy-policy/welding-gas-wallet/terms/
          - Safety disclaimer: https://lrodeveloperr.github.io/privacy-policy/welding-gas-wallet/disclaimer/
          - Support: https://lrodeveloperr.github.io/privacy-policy/welding-gas-wallet/support/
          MD

          # Product-boundary gate: no active certificate/consumable/scanner code.
          if grep -RniE 'consumable|certificate|mobile_scanner|qr_flutter|open_filex' \
              lib android/app/src/main/AndroidManifest.xml ios/Runner/Info.plist pubspec.yaml test; then
            echo 'Cylinder-only boundary violation found.' >&2
            exit 1
          fi

          git status --short

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Render dashboard design evidence
        run: flutter test --update-goldens test/dashboard_golden_test.dart

      - name: Test Flutter domain and widgets
        run: flutter test

      - name: Build debug APK
        id: flutter_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welding-gas-wallet-flutter-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload dashboard design evidence
        if: steps.flutter_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: welding-gas-wallet-dashboard
          path: test/goldens/dashboard.png
          if-no-files-found: error

      - name: Upload debug APK
        if: steps.flutter_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: welding-gas-wallet-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Commit cylinder-only source
        if: github.event_name == 'push' && steps.flutter_build.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remove certificate and consumable features; cylinders only [skip ci]"
          git push

      - name: Fail if Flutter build failed
        if: steps.flutter_build.outcome == 'failure'
        run: exit 1
