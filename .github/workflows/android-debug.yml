          s = pub.read_text()
          s = re.sub(r'^description:.*$', 'description: Offline welding gas cylinder inventory, costs, reminders and backup for Android and iOS.', s, flags=re.M)
          for dep in ('  mobile_scanner: ^7.4.0\n', '  open_filex: ^4.7.0\n', '  qr_flutter: ^4.1.0\n'):
              s = s.replace(dep, '')
          pub.write_text(s)

          # Restore visible gas-wallet branding while preserving the later
          # AdMob/backup platform configuration.
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          s = s.replace('    <uses-permission android:name="android.permission.CAMERA" />\n', '')
          s = s.replace('android:label="Welding Wallet"', 'android:label="Welding Gas Wallet"')
          manifest.write_text(s)

