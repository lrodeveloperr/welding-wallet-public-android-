name: Flutter Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Remove consumables and certificate feature
        shell: bash
        run: |
          set -euo pipefail
          git revert --no-commit 9bc0a62cc539b6f3e38f4b3f33581e8a73c0def4
          # Keep the current package/dependency graph and this workflow so later
          # monetization/backup work is not accidentally rolled back.
          git checkout HEAD -- pubspec.yaml pubspec.lock .github/workflows/android-debug.yml
          echo "Revert applied cleanly."
          git status --short

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Render dashboard design evidence
        run: flutter test --update-goldens test/dashboard_golden_test.dart

      - name: Test Flutter domain and widgets
        run: flutter test

      - name: Build debug APK
        id: flutter_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welding-wallet-flutter-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload dashboard design evidence
        if: steps.flutter_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: welding-wallet-dashboard
          path: test/goldens/dashboard.png
          if-no-files-found: error

      - name: Upload debug APK
        if: steps.flutter_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: welding-wallet-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Commit cylinder-only source
        if: github.event_name == 'push' && steps.flutter_build.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remove consumables and certificate tracking; keep cylinders only [skip ci]"
          git push

      - name: Fail if Flutter build failed
        if: steps.flutter_build.outcome == 'failure'
        run: exit 1
