name: Flutter Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare cylinder-only source
        shell: bash
        run: |
          set -euo pipefail
          BASE=408b6e03257c922521c55d3259f2f506baebd881

          # Restore the last cylinder-only domain/UI baseline, then reapply only
          # later unrelated monetization, backup and lifecycle improvements.
          git checkout "$BASE" -- \
            lib/core/models.dart \
            lib/core/wallet_engine.dart \
            lib/ui/wallet_app.dart \
            test/dashboard_golden_test.dart \
            test/wallet_engine_test.dart
          git rm -f --ignore-unmatch \
            lib/core/consumables.dart \
            lib/services/document_store.dart \
            docs/welding-wallet-name-checklist.md

          cat > lib/app_controller.dart <<'DART'
          import 'dart:async';

          import 'package:flutter/widgets.dart';
          import 'package:in_app_purchase/in_app_purchase.dart';

          import 'core/models.dart';
          import 'core/wallet_engine.dart';
          import 'services/ad_service.dart';
          import 'services/backup_service.dart';
          import 'services/billing_service.dart';
          import 'services/reminder_service.dart';

          class SelectedBackup {
            const SelectedBackup({
              required this.encoded,
              required this.preview,
              required this.expectedRevision,
            });

            final String encoded;
            final WalletData preview;
            final int expectedRevision;
          }

          class AppController extends ChangeNotifier with WidgetsBindingObserver {
            AppController({
              required this.engine,
              BillingService? billing,
              AdService? ads,
              ReminderService? reminders,
              BackupService? backups,
            }) : billing = billing ?? BillingService(),
                 ads = ads ?? AdService(),
                 reminders = reminders ?? ReminderService(),
                 backups = backups ?? BackupService() {
              this.ads.addListener(_handleAdChange);
            }

            final WalletEngine engine;
            final BillingService billing;
            final AdService ads;
            final ReminderService reminders;
            final BackupService backups;

            WalletData? wallet;
            bool loading = true;
            String? error;
            String? notice;
            int tabIndex = 0;
            StreamSubscription<Entitlement>? _entitlementSubscription;
            bool _observingLifecycle = false;

            void _handleAdChange() => notifyListeners();

            Future<void> initialize() async {
              try {
                if (!_observingLifecycle) {
                  WidgetsBinding.instance.addObserver(this);
                  _observingLifecycle = true;
                }
                await billing.initialize();
                await reminders.initialize();
                _entitlementSubscription = billing.verifiedEntitlements.listen((entitlement) async {
                  await engine.resumePendingDraft(entitlement);
                  await reload(notify: true);
                  notice = 'Welding Gas Wallet Pro is active.';
                  notifyListeners();
                });
                try {
                  await billing.restore();
                } catch (_) {
                  // Offline startup must not be blocked by an unavailable store.
                }
                wallet = await engine.snapshot();
                if (wallet!.settings.remindersEnabled) await reconcileReminders();
                await engine.enforceDowngradeIfNeeded();
                wallet = await engine.snapshot();
              } catch (value) {
                error = _message(value);
              } finally {
                loading = false;
                notifyListeners();
              }
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.resumed) {
                unawaited(restorePurchases(silent: true));
              }
            }

            Future<void> reload({bool notify = true}) async {
              wallet = await engine.snapshot();
              if (notify) notifyListeners();
            }

            void selectTab(int index) {
              tabIndex = index;
              notifyListeners();
            }

            void clearMessage() {
              error = null;
              notice = null;
            }

            Future<bool> run(Future<void> Function() action, {String? success}) async {
              clearMessage();
              try {
                await action();
                await reload(notify: false);
                notice = success;
                notifyListeners();
                return true;
              } catch (value) {
                error = _message(value);
                notifyListeners();
                return false;
              }
            }

            Future<AddCylinderResult?> addCylinder(AddCylinderDraft draft) async {
              clearMessage();
              try {
                final result = await engine.addOrGate(draft);
                await reload(notify: false);
                notice = result.wasAdded ? 'Cylinder added.' : null;
                notifyListeners();
                return result;
              } catch (value) {
                error = _message(value);
                notifyListeners();
                return null;
              }
            }

            Future<void> createReminder({
              required String cylinderId,
              required ReminderKind kind,
              required String title,
              required DateTime dueAt,
            }) async {
              final reminder = await engine.createReminder(
                cylinderId: cylinderId,
                kind: kind,
                title: title,
                dueAt: dueAt,
              );
              final current = await engine.snapshot();
              if (current.settings.remindersEnabled) {
                final cylinder = current.cylinders.firstWhere((value) => value.id == cylinderId);
                await reminders.schedule(reminder, cylinderName: cylinder.nickname);
              }
            }

            Future<void> completeReminder(String reminderId) async {
              final current = await engine.snapshot();
              final reminder = current.reminders.firstWhere((value) => value.id == reminderId);
              await reminders.cancel(reminder);
              await engine.completeReminder(reminderId);
            }

            Future<void> deleteReminder(String reminderId) async {
              await engine.deleteReminder(
                reminderId,
                cancelSystemReminder: reminders.cancel,
              );
            }

            Future<void> setRemindersEnabled(bool enabled) async {
              if (enabled && !await reminders.requestPermission()) {
                throw const WalletRuleException(
                  'Notifications are disabled. Allow them in device settings first.',
                );
              }
              await engine.updateSettings(remindersEnabled: enabled);
              if (enabled) {
                await reconcileReminders();
              } else {
                await reminders.cancelAll();
              }
            }

            Future<void> reconcileReminders() async {
              final current = await engine.snapshot();
              for (final reminder in current.reminders.where(
                (value) => !value.completed && value.dueAt.isAfter(DateTime.now().toUtc()),
              )) {
                final cylinder = current.cylinders.firstWhere(
                  (value) => value.id == reminder.cylinderId,
                );
                await reminders.schedule(reminder, cylinderName: cylinder.nickname);
              }
            }

            Future<List<ProductDetails>> products() async {
              try {
                return await billing.products();
              } catch (value) {
                error = _message(value);
                notifyListeners();
                return const <ProductDetails>[];
              }
            }

            Future<void> purchase(ProductDetails product) async {
              await run(() => billing.purchase(product));
            }

            Future<void> restorePurchases({bool silent = false}) async {
              if (silent) {
                try {
                  await billing.restore();
                } catch (_) {
                  // Background entitlement refresh must not interrupt the user.
                }
                return;
              }
              await run(billing.restore, success: 'Purchases checked.');
            }

            Future<void> openPurchaseManagement() async {
              await run(billing.openManagement);
            }

            Future<void> showAdPrivacyOptions() async {
              await run(ads.showPrivacyOptions);
            }

            Future<bool> exportBackup() async {
              clearMessage();
              try {
                final saved = await backups.save(await engine.exportBackup());
                notice = saved ? 'Backup saved.' : null;
                notifyListeners();
                return saved;
              } catch (value) {
                error = _message(value);
                notifyListeners();
                return false;
              }
            }

            Future<SelectedBackup?> chooseBackup() async {
              clearMessage();
              try {
                final encoded = await backups.pick();
                if (encoded == null) return null;
                final current = await engine.snapshot();
                return SelectedBackup(
                  encoded: encoded,
                  preview: engine.inspectBackup(encoded),
                  expectedRevision: current.revision,
                );
              } catch (value) {
                error = _message(value);
                notifyListeners();
                return null;
              }
            }

            Future<bool> restoreBackup(SelectedBackup backup) async {
              return run(() async {
                await reminders.cancelAll();
                await engine.importBackup(
                  backup.encoded,
                  expectedRevision: backup.expectedRevision,
                );
                final current = await engine.snapshot();
                if (current.settings.remindersEnabled) await reconcileReminders();
              }, success: 'Backup restored.');
            }

            Future<bool> deleteAllData() async => run(() async {
              await reminders.cancelAll();
              await engine.deleteAllWalletData(confirmed: true);
            }, success: 'Wallet deleted.');

            String _message(Object value) => switch (value) {
              WalletRuleException exception => exception.message,
              StateError exception => exception.message.toString(),
              _ => 'Something went wrong. Check the wallet before retrying.',
            };

            @override
            void dispose() {
              if (_observingLifecycle) WidgetsBinding.instance.removeObserver(this);
              _entitlementSubscription?.cancel();
              ads.removeListener(_handleAdChange);
              ads.dispose();
              unawaited(billing.dispose());
              super.dispose();
            }
          }
          DART

          python3 <<'PY'
          from pathlib import Path
          import re

          # Keep schema monotonic so installs that briefly wrote the removed
          # feature's v5 payload still load. Unknown JSON fields are ignored by
          # the cylinder-only model and disappear on the next write/export.
          models = Path('lib/core/models.dart')
          s = models.read_text()
          s = s.replace('const int walletSchemaVersion = 3;', 'const int walletSchemaVersion = 5;')
          models.write_text(s)

          engine = Path('lib/core/wallet_engine.dart')
          s = engine.read_text()
          old = '''  Future<WalletData> enforceDowngradeIfNeeded() =>
              repository.transact((current) {
                if (current.entitlementCache.isProAt(_clock)) return current;
                final allowed = current.cylinders
                    .where((value) => value.consumesCurrentSlot)
                    .take(freeEditableCylinderLimit)
                    .map((value) => value.id)
                    .toList();
                return current.next(
                  freeEditableSelection: allowed,
                  entitlementCache: Entitlement.free,
                );
              });'''
          new = '''  Future<WalletData> enforceDowngradeIfNeeded() =>
              repository.transact((current) {
                if (current.entitlementCache.isProAt(_clock)) return current;
                final currentCylinderIds = current.cylinders
                    .where((value) => value.consumesCurrentSlot)
                    .map((value) => value.id)
                    .toList();
                final allowed = <String>{
                  ...current.freeEditableSelection.where(currentCylinderIds.contains),
                  ...currentCylinderIds,
                }.take(freeEditableCylinderLimit).toList();
                return current.next(
                  freeEditableSelection: allowed,
                  entitlementCache: Entitlement.free,
                );
              });'''
          if old not in s:
              raise SystemExit('downgrade block not found')
          s = s.replace(old, new)

          old_import = '''    final raw = jsonDecode(encoded);
            if (raw is! Map || raw['wallet'] is! Map) {
              throw const WalletRuleException(
                'This is not a Welding Gas Wallet backup.',
              );
            }
            final current = await repository.read();
            if (current.revision != expectedRevision) {
              throw const WalletRuleException(
                'Wallet data changed. Review the backup again.',
              );
            }
            final imported = WalletData.fromJson(
              Map<String, Object?>.from(raw['wallet'] as Map),
            );
            _validateImported(imported);'''
          new_import = '''    final current = await repository.read();
            if (current.revision != expectedRevision) {
              throw const WalletRuleException(
                'Wallet data changed. Review the backup again.',
              );
            }
            final imported = inspectBackup(encoded);'''
          if old_import not in s:
              raise SystemExit('import backup block not found')
          s = s.replace(old_import, new_import)

          insert_at = s.index('  Future<void> deleteAllWalletData')
          inspect = '''  WalletData inspectBackup(String encoded) {
            if (utf8.encode(encoded).length > maximumBackupBytes) {
              throw const WalletRuleException('The backup is larger than 5 MB.');
            }
            try {
              final raw = jsonDecode(encoded);
              if (raw is! Map || raw['wallet'] is! Map) {
                throw const WalletRuleException(
                  'This is not a Welding Gas Wallet backup.',
                );
              }
              final format = raw['format'];
              if (format != 'welding-gas-wallet-backup' &&
                  format != 'welding-wallet-backup') {
                throw const WalletRuleException(
                  'This is not a Welding Gas Wallet backup.',
                );
              }
              final imported = WalletData.fromJson(
                Map<String, Object?>.from(raw['wallet'] as Map),
              );
              _validateImported(imported);
              return imported;
            } on WalletRuleException {
              rethrow;
            } catch (_) {
              throw const WalletRuleException(
                'This is not a Welding Gas Wallet backup.',
              );
            }
          }

          '''
          s = s[:insert_at] + inspect + s[insert_at:]
          engine.write_text(s)

          ui = Path('lib/ui/wallet_app.dart')
          s = ui.read_text()
          s = "import 'dart:async';\nimport 'dart:io';\n\n" + s
          s = s.replace("import 'package:flutter_localizations/flutter_localizations.dart';\n", "import 'package:flutter_localizations/flutter_localizations.dart';\nimport 'package:google_mobile_ads/google_mobile_ads.dart';\n")
          s = s.replace("import '../core/wallet_repository.dart';\n", "import '../core/wallet_repository.dart';\nimport '../services/ad_service.dart';\n")
          s = s.replace('home: _WalletRoot(controller: widget.controller),', 'home: _WalletRoot(controller: widget.controller, enableAds: widget.autoInitialize),')
          s = s.replace('const _WalletRoot({required this.controller});\n  final AppController controller;', 'const _WalletRoot({required this.controller, required this.enableAds});\n  final AppController controller;\n  final bool enableAds;')
          s = s.replace('return _WalletShell(controller: controller, wallet: wallet);', 'return _WalletShell(controller: controller, wallet: wallet, enableAds: enableAds);')
          s = s.replace('const _WalletShell({required this.controller, required this.wallet});\n  final AppController controller;\n  final WalletData wallet;', 'const _WalletShell({required this.controller, required this.wallet, required this.enableAds});\n  final AppController controller;\n  final WalletData wallet;\n  final bool enableAds;')

          shell_start = s.index('class _WalletShell')
          dash_start = s.index('class _DashboardScreen')
          shell = s[shell_start:dash_start]
          old_settings_call = '''      _SettingsScreen(
                wallet: wallet,
                onSuppliers: () => _openSuppliers(context, controller),
                onPro: () => _openPaywall(context, controller),
                onReminderToggle: (value) =>
                    controller.run(() => controller.setRemindersEnabled(value)),
                onLocale: (value) => controller.run(
                  () => controller.engine.updateSettings(locale: value),
                ),
                onCurrency: (value) => controller.run(
                  () => controller.engine.updateSettings(currencyCode: value),
                ),
              ),'''
          new_settings_call = '''      _SettingsScreen(
                wallet: wallet,
                onSuppliers: () => _openSuppliers(context, controller),
                onPro: () => _openPaywall(context, controller),
                onReminderToggle: (value) =>
                    controller.run(() => controller.setRemindersEnabled(value)),
                onLocale: (value) => controller.run(
                  () => controller.engine.updateSettings(locale: value),
                ),
                onCurrency: (value) => controller.run(
                  () => controller.engine.updateSettings(currencyCode: value),
                ),
                onMassUnit: (value) => controller.run(
                  () => controller.engine.updateSettings(defaultMassUnit: value),
                ),
                onVolumeUnit: (value) => controller.run(
                  () => controller.engine.updateSettings(defaultVolumeUnit: value),
                ),
                onBackup: controller.exportBackup,
                onRestore: () => _restoreBackup(context, controller),
                onDelete: () => _deleteWallet(context, controller),
                onFreeRecords: () => _openFreeCylinderPicker(context, controller),
                privacyOptionsRequired: controller.ads.privacyOptionsRequired,
                onPrivacyOptions: controller.showAdPrivacyOptions,
              ),'''
          if old_settings_call not in shell:
              raise SystemExit('settings call not found')
          shell = shell.replace(old_settings_call, new_settings_call)
          shell = shell.replace('    return Scaffold(\n', "    final isPro = wallet.entitlementCache.isProAt(DateTime.now().toUtc());\n    return Scaffold(\n", 1)
          old_nav = '''      bottomNavigationBar: NavigationBar(
                selectedIndex: controller.tabIndex,
                onDestinationSelected: controller.selectTab,
                destinations: const [
                  NavigationDestination(
                    icon: Icon(Icons.account_balance_wallet_outlined),
                    selectedIcon: Icon(Icons.account_balance_wallet),
                    label: 'Wallet',
                  ),
                  NavigationDestination(
                    icon: Icon(Icons.receipt_long_outlined),
                    selectedIcon: Icon(Icons.receipt_long),
                    label: 'Activity',
                  ),
                  NavigationDestination(
                    icon: Icon(Icons.notifications_none),
                    selectedIcon: Icon(Icons.notifications),
                    label: 'Reminders',
                  ),
                  NavigationDestination(
                    icon: Icon(Icons.settings_outlined),
                    selectedIcon: Icon(Icons.settings),
                    label: 'Settings',
                  ),
                ],
              ),'''
          new_nav = '''      bottomNavigationBar: Column(
                mainAxisSize: MainAxisSize.min,
                children: [
                  NavigationBar(
                    selectedIndex: controller.tabIndex,
                    onDestinationSelected: controller.selectTab,
                    destinations: const [
                      NavigationDestination(
                        icon: Icon(Icons.account_balance_wallet_outlined),
                        selectedIcon: Icon(Icons.account_balance_wallet),
                        label: 'Wallet',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.receipt_long_outlined),
                        selectedIcon: Icon(Icons.receipt_long),
                        label: 'Activity',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.notifications_none),
                        selectedIcon: Icon(Icons.notifications),
                        label: 'Reminders',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.settings_outlined),
                        selectedIcon: Icon(Icons.settings),
                        label: 'Settings',
                      ),
                    ],
                  ),
                  if (enableAds && !isPro) _FreeBanner(service: controller.ads),
                ],
              ),'''
          if old_nav not in shell:
              raise SystemExit('bottom nav not found')
          shell = shell.replace(old_nav, new_nav)
          s = s[:shell_start] + shell + s[dash_start:]

          free_banner = r'''class _FreeBanner extends StatefulWidget {
            const _FreeBanner({required this.service});
            final AdService service;

            @override
            State<_FreeBanner> createState() => _FreeBannerState();
          }

          class _FreeBannerState extends State<_FreeBanner> {
            BannerAd? _banner;
            bool _loaded = false;

            @override
            void initState() {
              super.initState();
              widget.service.addListener(_sync);
              unawaited(widget.service.initialize());
              _sync();
            }

            void _sync() {
              if (!mounted) return;
              if (!widget.service.canLoadAds) {
                _banner?.dispose();
                _banner = null;
                if (_loaded) setState(() => _loaded = false);
                return;
              }
              if (_banner != null) return;
              final banner = BannerAd(
                adUnitId: widget.service.bannerUnitId,
                size: AdSize.banner,
                request: const AdRequest(nonPersonalizedAds: true),
                listener: BannerAdListener(
                  onAdLoaded: (ad) {
                    if (!mounted) {
                      ad.dispose();
                      return;
                    }
                    setState(() => _loaded = true);
                  },
                  onAdFailedToLoad: (ad, _) {
                    ad.dispose();
                    if (!mounted) return;
                    setState(() {
                      _banner = null;
                      _loaded = false;
                    });
                  },
                ),
              );
              _banner = banner;
              banner.load();
            }

            @override
            void dispose() {
              widget.service.removeListener(_sync);
              _banner?.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final banner = _banner;
              if (!_loaded || banner == null) return const SizedBox.shrink();
              return Semantics(
                label: 'Advertisement',
                child: Container(
                  height: 51,
                  width: double.infinity,
                  alignment: Alignment.center,
                  decoration: const BoxDecoration(
                    color: Colors.white,
                    border: Border(top: BorderSide(color: WalletColors.border)),
                  ),
                  child: SizedBox(
                    width: banner.size.width.toDouble(),
                    height: banner.size.height.toDouble(),
                    child: AdWidget(ad: banner),
                  ),
                ),
              );
            }
          }

          '''
          s = s.replace('class _DashboardScreen extends StatelessWidget {', free_banner + 'class _DashboardScreen extends StatelessWidget {', 1)
          s = s.replace('Welding Wallet Dashboard', 'Welding Gas Wallet')

          settings_start = s.index('class _SettingsScreen extends StatelessWidget')
          settings_end = s.index('class _LinkTile extends StatelessWidget')
          settings = r'''class _SettingsScreen extends StatelessWidget {
            const _SettingsScreen({
              required this.wallet,
              required this.onSuppliers,
              required this.onPro,
              required this.onReminderToggle,
              required this.onLocale,
              required this.onCurrency,
              required this.onMassUnit,
              required this.onVolumeUnit,
              required this.onBackup,
              required this.onRestore,
              required this.onDelete,
              required this.onFreeRecords,
              required this.privacyOptionsRequired,
              required this.onPrivacyOptions,
            });
            final WalletData wallet;
            final VoidCallback onSuppliers;
            final VoidCallback onPro;
            final ValueChanged<bool> onReminderToggle;
            final ValueChanged<String> onLocale;
            final ValueChanged<String> onCurrency;
            final ValueChanged<String> onMassUnit;
            final ValueChanged<String> onVolumeUnit;
            final Future<bool> Function() onBackup;
            final VoidCallback onRestore;
            final VoidCallback onDelete;
            final VoidCallback onFreeRecords;
            final bool privacyOptionsRequired;
            final VoidCallback onPrivacyOptions;

            @override
            Widget build(BuildContext context) {
              final isPro = wallet.entitlementCache.isProAt(DateTime.now().toUtc());
              final currentCount = wallet.cylinders.where((value) => value.consumesCurrentSlot).length;
              return _ScreenFrame(
                title: 'Settings',
                subtitle: 'Preferences, suppliers, privacy and plan controls.',
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Card(
                      color: WalletColors.ink,
                      child: Padding(
                        padding: const EdgeInsets.all(18),
                        child: Row(
                          children: [
                            Container(
                              width: 44,
                              height: 44,
                              decoration: BoxDecoration(
                                color: Colors.white.withValues(alpha: 0.12),
                                borderRadius: BorderRadius.circular(12),
                              ),
                              child: const Icon(Icons.workspace_premium, color: Colors.white),
                            ),
                            const SizedBox(width: 13),
                            Expanded(
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Text(
                                    isPro ? 'Welding Gas Wallet Pro' : 'Free plan',
                                    style: Theme.of(context).textTheme.titleMedium?.copyWith(color: Colors.white),
                                  ),
                                  const SizedBox(height: 2),
                                  Text(
                                    isPro ? 'No ads · Unlimited cylinders' : '3 current cylinders · Banner ad',
                                    style: const TextStyle(color: Color(0xFFBFC9D7)),
                                  ),
                                ],
                              ),
                            ),
                            TextButton(
                              onPressed: onPro,
                              style: TextButton.styleFrom(foregroundColor: Colors.white),
                              child: Text(isPro ? 'Manage' : 'Upgrade'),
                            ),
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 24),
                    const _SectionLabel('WALLET SETUP'),
                    const SizedBox(height: 10),
                    _SettingsCard(
                      children: [
                        ListTile(
                          leading: const Icon(Icons.store_outlined),
                          title: const Text('Suppliers'),
                          subtitle: Text('${wallet.suppliers.length} saved'),
                          trailing: const Icon(Icons.chevron_right),
                          onTap: onSuppliers,
                        ),
                        SwitchListTile(
                          secondary: const Icon(Icons.notifications_outlined),
                          title: const Text('Device reminders'),
                          subtitle: const Text('Use local notifications for due dates'),
                          value: wallet.settings.remindersEnabled,
                          onChanged: onReminderToggle,
                        ),
                        if (!isPro && currentCount > freeEditableCylinderLimit)
                          ListTile(
                            leading: const Icon(Icons.checklist_outlined),
                            title: const Text('Free cylinders'),
                            subtitle: const Text('Choose the three editable cylinders'),
                            trailing: const Icon(Icons.chevron_right),
                            onTap: onFreeRecords,
                          ),
                      ],
                    ),
                    const SizedBox(height: 24),
                    const _SectionLabel('REGION & UNITS'),
                    const SizedBox(height: 10),
                    _SettingsCard(
                      children: [
                        ListTile(
                          leading: const Icon(Icons.language),
